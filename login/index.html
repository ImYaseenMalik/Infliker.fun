<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — infliker CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/login/login.css">
</head>
<body class="bg-slate-50">
  <div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
      <h2 class="text-2xl font-semibold mb-4">Admin login</h2>
      <p class="text-sm text-slate-500 mb-6">Enter your ADMIN API KEY (the secret you set in the Worker). It will be stored in your browser (localStorage).</p>

      <label class="block mb-2">API Key</label>
      <input id="apiKey" class="w-full border rounded p-2 mb-4" placeholder="Paste ADMIN API KEY here">

      <div class="flex gap-2">
        <button id="saveBtn" class="flex-1 bg-indigo-600 text-white p-2 rounded">Save & Enter Dashboard</button>
        <button id="clearBtn" class="px-4 py-2 border rounded">Clear</button>
      </div>

      <p class="mt-4 text-sm text-slate-400">If you don't have the key, open your Worker → Settings → Add Secret ADMIN_API_KEY or ask the server admin.</p>
    </div>
  </div>

  <script type="module" src="/login/login.js"></script>
</body>
</html>
