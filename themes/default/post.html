<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Post</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="max-w-4xl mx-auto p-6">
  <a href="/" class="text-sm text-slate-500">&larr; Home</a>
  <article id="post" class="mt-4"></article>

  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) document.getElementById('post').innerText = 'No post id';
    else fetch('/api/posts/' + id).then(r=>r.json()).then(p=>{
      if(!p) { document.getElementById('post').innerText='Not found'; return; }
      document.getElementById('post').innerHTML = `<h1 class="text-2xl font-bold">${p.title}</h1><div class="mt-4">${p.content}</div>`;
    });
  </script>
</body>
</html>
