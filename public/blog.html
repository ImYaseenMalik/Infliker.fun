<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blog</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header><a href="/">Home</a> — <a href="/admin.html">Dashboard</a></header>
  <main>
    <h1>Blog</h1>
    <div id="posts"></div>
  </main>
  <script>
    async function fetchPosts(){
      const res = await fetch('/api/posts');
      if(!res.ok){ document.getElementById('posts').innerText = 'Failed to load posts'; return; }
      const posts = await res.json();
      if(location.search.includes('id=')){
        const id = new URLSearchParams(location.search).get('id');
        const p = posts.find(x=>String(x.id)===String(id));
        if(p){
          document.getElementById('posts').innerHTML = `<article><h2>${p.title}</h2><div>${p.content}</div></article>`;
          return;
        }
      }
      const html = posts.map(p=>`<article><h3><a href="?id=${p.id}">${p.title}</a></h3><p>${p.excerpt||''}</p></article>`).join('');
      document.getElementById('posts').innerHTML = html;
    }
    fetchPosts();
  </script>
</body>
</html>
