<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CMS Dashboard</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header>
    <h1>CMS Dashboard</h1>
    <nav><a href="/">Public</a> <a href="/blog.html">Blog</a></nav>
  </header>
  <main>
    <section>
      <h2>Create / Edit Post</h2>
      <label>Title: <input id="title" /></label><br/>
      <label>Excerpt: <input id="excerpt" /></label><br/>
      <label>Content:<br/>
        <textarea id="content" rows="10" cols="60"></textarea>
      </label><br/>
      <button id="save">Save Post</button>
    </section>

    <section>
      <h2>Upload Media</h2>
      <input type="file" id="media"><button id="uploadBtn">Upload</button>
      <div id="mediaResult"></div>
    </section>

    <section>
      <h2>All Posts</h2>
      <div id="list"></div>
    </section>
  </main>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
