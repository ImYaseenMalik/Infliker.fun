<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Dashboard — infliker CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/dashboard/dashboard.css">
</head>
<body class="bg-slate-50">
  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r p-4">
      <div class="mb-6">
        <h2 class="text-lg font-semibold">infliker CMS</h2>
        <p class="text-sm text-slate-500">Admin Dashboard</p>
      </div>

      <nav class="space-y-2">
        <button data-tab="posts" class="tab-btn w-full text-left p-2 rounded hover:bg-slate-100">Posts</button>
        <button data-tab="media" class="tab-btn w-full text-left p-2 rounded hover:bg-slate-100">Media</button>
        <button data-tab="themes" class="tab-btn w-full text-left p-2 rounded hover:bg-slate-100">Themes</button>
        <button data-tab="settings" class="tab-btn w-full text-left p-2 rounded hover:bg-slate-100">Settings</button>
      </nav>

      <div class="mt-6 text-sm text-slate-500">
        <button id="logout" class="text-red-600">Logout</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6">
      <div id="content">
        <!-- Posts view -->
        <section id="view-posts" class="hidden">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-xl font-semibold">Posts</h3>
            <button id="newPostBtn" class="bg-indigo-600 text-white px-3 py-2 rounded">New Post</button>
          </div>

          <div class="grid grid-cols-3 gap-4" id="postsList"></div>
        </section>

        <!-- Editor -->
        <section id="view-editor" class="hidden">
          <div class="mb-4">
            <button id="backToPosts" class="text-sm text-slate-600">&larr; Back to posts</button>
          </div>
          <input id="postTitle" class="w-full border p-2 rounded mb-2" placeholder="Post title">
          <input id="postExcerpt" class="w-full border p-2 rounded mb-2" placeholder="Excerpt (optional)">
          <textarea id="postContent" rows="12" class="w-full border p-2 rounded mb-2" placeholder="HTML content"></textarea>
          <div class="flex gap-2">
            <button id="savePost" class="bg-green-600 text-white px-4 py-2 rounded">Save</button>
            <button id="deletePost" class="bg-red-600 text-white px-4 py-2 rounded">Delete</button>
          </div>
        </section>

        <!-- Media -->
        <section id="view-media" class="hidden">
          <div class="mb-4 flex items-center justify-between">
            <h3 class="text-xl font-semibold">Media</h3>
            <div>
              <input id="mediaFile" type="file">
              <button id="uploadMediaBtn" class="bg-indigo-600 text-white px-3 py-2 rounded ml-2">Upload</button>
            </div>
          </div>
          <div id="mediaGrid" class="grid grid-cols-4 gap-4"></div>
        </section>

        <!-- Themes -->
        <section id="view-themes" class="hidden">
          <h3 class="text-xl font-semibold mb-4">Themes</h3>
          <div class="grid grid-cols-3 gap-4">
            <div class="p-4 border rounded">
              <h4 class="font-semibold">Default</h4>
              <p class="text-sm text-slate-500">Built-in default theme</p>
              <div class="mt-3">
                <button data-theme="default" class="applyThemeBtn bg-indigo-600 text-white px-3 py-1 rounded">Activate</button>
                <a href="/themes/default/home.html" target="_blank" class="ml-2 text-sm underline">Preview</a>
              </div>
            </div>
          </div>
        </section>

        <!-- Settings -->
        <section id="view-settings" class="hidden">
          <h3 class="text-xl font-semibold mb-4">Settings</h3>
          <label class="block mb-2">Site title</label>
          <input id="siteTitle" class="w-full border p-2 rounded mb-4">
          <button id="saveSettings" class="bg-indigo-600 text-white px-4 py-2 rounded">Save Settings</button>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/dashboard/dashboard.js"></script>
</body>
</html>
