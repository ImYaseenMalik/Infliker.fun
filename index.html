<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Website</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">MySite</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="admin.html" id="adminLink">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Welcome to My Professional Website</h1>
            <p>Sharing insights and updates</p>
        </section>

        <section class="recent-posts">
            <h2>Recent Posts</h2>
            <div id="postsContainer">
                <!-- Posts will load here -->
                <div class="loading">Loading posts...</div>
            </div>
            <a href="blog.html" class="btn">View All Posts</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 My Website. All rights reserved.</p>
    </footer>

    <!-- Firebase Configuration -->
    <script src="js/firebase-config.js"></script>
    <!-- Main Script -->
    <script src="js/cms.js"></script>
    <script>
        // Load recent posts on homepage
        document.addEventListener('DOMContentLoaded', function() {
            loadRecentPosts(3); // Show 3 recent posts
        });
    </script>
</body>
</html>
