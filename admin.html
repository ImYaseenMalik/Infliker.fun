<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <h2>CMS Dashboard</h2>
            <div id="userInfo" style="color: white; margin-bottom: 20px; display: none;">
                <p id="userEmail"></p>
            </div>
            <nav>
                <ul>
                    <li><a href="#" onclick="showSection('posts')">📝 Manage Posts</a></li>
                    <li><a href="#" onclick="showSection('new-post')">✨ Create Post</a></li>
                    <li><a href="#" onclick="logout()">🚪 Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="admin-main">
            <!-- Login Section -->
            <div id="loginSection" class="login-section">
                <h2>Admin Login</h2>
                <p style="margin-bottom: 20px;">Use your Google account to login</p>
                
                <div id="loginError" class="error" style="display: none;"></div>
                
                <!-- Google Login Button -->
                <button onclick="loginWithGoogle()" class="google-login-btn">
                    <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 20px; margin-right: 10px;">
                    Continue with Google
                </button>
                
                <div style="margin: 20px 0; text-align: center;">OR</div>
                
                <!-- Email/Password Login (Optional) -->
                <h3>Email/Password Login</h3>
                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="loginWithEmail()" class="btn">Login with Email</button>
            </div>

            <!-- Dashboard (shown after login) -->
            <div id="dashboard" style="display:none;">
                <!-- Posts Management -->
                <section id="postsSection" style="display:none;">
                    <h2>Manage Posts</h2>
                    <div id="allPosts" class="admin-posts-container"></div>
                </section>

                <!-- Create New Post -->
                <section id="newPostSection" style="display:none;">
                    <h2>Create New Post</h2>
                    <div id="message" class="message" style="display: none;"></div>
                    
                    <div class="form-group">
                        <label for="postTitle">Post Title</label>
                        <input type="text" id="postTitle" placeholder="Enter post title">
                    </div>
                    
                    <div class="form-group">
                        <label for="postSlug">URL Slug (optional)</label>
                        <input type="text" id="postSlug" placeholder="post-url-slug">
                        <small>Leave blank to auto-generate from title</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="postContent">Post Content</label>
                        <textarea id="postContent" placeholder="Write your post content here..." rows="15"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="featuredImageUrl">Featured Image URL</label>
                        <input type="text" id="featuredImageUrl" placeholder="https://example.com/image.jpg">
                        <small>Enter direct image URL from Cloudflare or any image hosting</small>
                        <div id="imagePreview" class="image-preview"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="postExcerpt">Excerpt (optional)</label>
                        <textarea id="postExcerpt" placeholder="Short summary of the post" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="postPublished" checked>
                        <label for="postPublished">Publish immediately</label>
                    </div>
                    
                    <button onclick="createPost()" class="btn btn-primary">Publish Post</button>
                    <button onclick="saveDraft()" class="btn btn-secondary">Save as Draft</button>
                </section>
            </div>
        </main>
    </div>

    <!-- Firebase Configuration -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cms.js"></script>
    <script>
        // Check auth state on admin page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthState();
            
            // Preview image from URL
            const imageUrlInput = document.getElementById('featuredImageUrl');
            if (imageUrlInput) {
                imageUrlInput.addEventListener('input', function() {
                    const url = this.value.trim();
                    const preview = document.getElementById('imagePreview');
                    if (url && isValidUrl(url)) {
                        preview.innerHTML = `<img src="${url}" alt="Preview" style="max-width: 300px; margin-top: 10px;">`;
                    } else {
                        preview.innerHTML = '';
                    }
                });
            }
            
            // Auto-generate slug from title
            const titleInput = document.getElementById('postTitle');
            if (titleInput) {
                titleInput.addEventListener('input', function() {
                    const slugInput = document.getElementById('postSlug');
                    if (slugInput && !slugInput.value) {
                        const slug = this.value
                            .toLowerCase()
                            .replace(/[^\w\s]/g, '')
                            .replace(/\s+/g, '-');
                        slugInput.value = slug;
                    }
                });
            }
        });
        
        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }
    </script>
</body>
</html>
