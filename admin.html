<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body>
    <div class="admin-container">
        <aside class="sidebar">
            <h2>CMS Dashboard</h2>
            <nav>
                <ul>
                    <li><a href="#" onclick="showSection('posts')">Manage Posts</a></li>
                    <li><a href="#" onclick="showSection('new-post')">Create Post</a></li>
                    <li><a href="#" onclick="logout()">Logout</a></li>
                </ul>
            </nav>
        </aside>

        <main class="admin-main">
            <div id="loginSection" class="login-section">
                <h2>Admin Login</h2>
                <div id="loginError" class="error"></div>
                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="login()">Login</button>
            </div>

            <div id="dashboard" style="display:none;">
                <!-- Posts Management -->
                <section id="postsSection" style="display:none;">
                    <h2>Manage Posts</h2>
                    <div id="allPosts"></div>
                </section>

                <!-- Create New Post -->
                <section id="newPostSection" style="display:none;">
                    <h2>Create New Post</h2>
                    <div id="message" class="message"></div>
                    
                    <input type="text" id="postTitle" placeholder="Post Title">
                    <textarea id="postContent" placeholder="Post Content" rows="10"></textarea>
                    
                    <div class="upload-section">
                        <input type="file" id="featuredImage" accept="image/*">
                        <div id="imagePreview"></div>
                    </div>
                    
                    <button onclick="createPost()">Publish Post</button>
                </section>
            </div>
        </main>
    </div>

    <!-- Firebase Configuration -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cms.js"></script>
    <script>
        // Check auth state on admin page
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthState();
        });
    </script>
</body>
</html>
